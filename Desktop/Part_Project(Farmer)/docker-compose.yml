version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: farmers-postgres
    environment:
      POSTGRES_DB: farmer_crop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Tola15102007
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./create_tables.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farmer_crop"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmers-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/farmer_crop
      DB_USERNAME: postgres
      DB_PASSWORD: Tola15102007
      JPA_DDL_AUTO: validate
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
