spring:
  application:
    name: general-farmers

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/farmer_crop}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Tola15102007}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

weather:
  api:
    key: ${WEATHER_API_KEY:}
    base-url: ${WEATHER_API_URL:https://api.openweathermap.org/data/2.5}

file:
  storage:
    location: ${FILE_STORAGE_LOCATION:./uploads}
    allowed-types: image/jpeg,image/png,image/webp,application/pdf
    max-size: ${MAX_FILE_SIZE_BYTES:10485760}
